<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Heading out already?</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: #0b0b12;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 1rem;
    }

    p {
      font-size: 1.2rem;
      margin-bottom: 2rem;
      max-width: 400px;
    }

    .buttons {
      display: flex;
      gap: 1rem;
    }

    .btn {
      padding: 12px 20px;
      font-size: 1.1rem;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      background: rgba(255, 255, 255, 0.1);
      color: white;
      text-decoration: none;
      transition: 0.25s ease;
      backdrop-filter: blur(6px);
    }

    .btn:hover {
      transform: scale(1.08);
      background: rgba(255, 255, 255, 0.2);
    }
  </style>
</head>

<body>

  <h1>Are you sure you want to leave?</h1>
  <p>This action will take you away from this really fricken neat site.  
     Click **No** to stay where it's cozy & spooky, or **Yes** if you're really heading out.</p>

  <div class="buttons">
    <a class="btn" href="index.html">No</a>
    <a class="btn" href="https://disney.com" target="_blank">Yes</a>
  </div>

</body>
</html>
