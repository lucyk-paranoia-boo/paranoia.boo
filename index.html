<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>You're on a path in the woods...</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: url('assets/foggywoods.jpg') no-repeat center center/cover; /* dark theme */
            color: #fff;
            font-family: 'Segoe UI', sans-serif;
            text-align: center;
        }

        button {
            padding: 15px 30px;
            font-size: 18px;
            cursor: pointer;
            background-color: #800000;
            color: #fff;
            border: none;
            border-radius: 8px;
            transition: 0.3s;
        }

        button:hover {
            background-color: #a00000;
        }
    </style>
</head>
<body>
    <div>
        <h1>You're on a path in the woods.</h1>
        <p>And at the end of that path is a cabin- Wait. This isn't right...</p>
        <button onclick="goToMain()">(explore)What do you mean?</button>
    </div>

    <script>
        function goToMain() {
            window.location.href = "blahaj.html"; // link to main page
        }
    </script>
</body>
</html>
